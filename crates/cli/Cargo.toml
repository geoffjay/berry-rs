[package]
name = "berry-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "berry"
path = "src/main.rs"

[dependencies]
# Shared library
berry = { workspace = true }

# Server and MCP libraries (for integrated serve/mcp commands)
berry-server = { path = "../server" }
berry-mcp = { path = "../mcp" }

# CLI framework
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Terminal output
colored = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Interactive prompts
inquire = "0.7"

# Table formatting
tabled = "0.18"

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"
